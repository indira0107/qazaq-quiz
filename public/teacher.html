<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QAZAQ Quiz · Оқытушы</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f1e3;color:#371610}.head{padding:24px;background:linear-gradient(135deg,#401013,#9d3e29);color:white}.head>div,main{max-width:1200px;margin:auto}h1{margin:0 0 7px}.login{max-width:540px;margin:70px auto;background:white;padding:30px;border-radius:22px;box-shadow:0 20px 60px #39150d22}input,button{font:inherit;padding:13px;border-radius:12px}input{width:100%;border:1px solid #d6b56d;margin:10px 0}button{border:0;background:#9c3928;color:white;font-weight:900;cursor:pointer}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:white;padding:18px;border-radius:18px;box-shadow:0 8px 25px #4b241116}.stat b{display:block;font-size:30px;color:#a13b29}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.pod{background:white;border:2px solid #e1bd63;border-radius:18px;padding:18px;text-align:center}.pod:first-child{background:#fff0a8}table{width:100%;border-collapse:collapse;background:white;border-radius:16px;overflow:hidden}th,td{text-align:left;padding:12px;border-bottom:1px solid #eadfc6}th{background:#542018;color:white}.answer-details{max-width:430px;white-space:normal;font-size:13px}.ok{color:#178044}.bad{color:#b52c2c}@media(max-width:720px){.stats,.podium{grid-template-columns:1fr}main{padding:0 10px}.table-wrap{overflow:auto}}
</style></head><body><div class="head"><div><h1>📊 QAZAQ Quiz · Нәтижелер</h1><div>«Мен, мен едім, мен едім!»</div></div></div><main><section id="login" class="login"><h2>Оқытушыға кіру</h2><p>Netlify жүйесінде орнатылған құпиясөзді енгізіңіз.</p><input id="password" type="password" placeholder="Құпиясөз"><button id="loginBtn">Нәтижелерді ашу</button><p id="error" class="bad"></p></section><section id="dashboard" hidden><div class="toolbar"><button id="refresh">🔄 Жаңарту</button><button id="download">⬇️ CSV жүктеу</button><span id="updated"></span></div><div class="stats"><div class="stat"><span>Қатысушылар</span><b id="count">0</b></div><div class="stat"><span>Орташа ұпай</span><b id="average">0</b></div><div class="stat"><span>Ең жоғары ұпай</span><b id="highest">0</b></div></div><h2>🏆 ТОП-3</h2><div id="podium" class="podium"></div><h2>Барлық жауаптар</h2><div class="table-wrap"><table><thead><tr><th>№</th><th>Студент</th><th>Ұпай</th><th>Уақыты</th><th>Жауаптары</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
let password='',data=[];const $=id=>document.getElementById(id);async function load(){const r=await fetch('/api/results',{headers:{'x-teacher-password':password}});const j=await r.json();if(!r.ok)throw Error(j.error||'Қате');data=j.rows||[];$('login').hidden=true;$('dashboard').hidden=false;$('count').textContent=data.length;$('average').textContent=data.length?(data.reduce((s,x)=>s+x.score,0)/data.length).toFixed(1):'0';$('highest').textContent=data[0]?data[0].score+'/'+data[0].total:'0';$('podium').innerHTML='';(j.top3||[]).forEach((x,i)=>{const d=document.createElement('div');d.className='pod';d.innerHTML='<div style="font-size:42px">'+['🥇','🥈','🥉'][i]+'</div><b></b><div>'+x.score+' / '+x.total+' · '+x.percent+'%</div>';d.querySelector('b').textContent=x.name;$('podium').appendChild(d)});$('rows').innerHTML='';data.forEach((x,i)=>{const tr=document.createElement('tr'),details=(x.answers||[]).map((a,n)=>(n+1)+'. '+(a.selectedText||'Жауап жоқ')+' '+(a.correct?'✓':'✗')).join('\n');tr.innerHTML='<td>'+(i+1)+'</td><td></td><td>'+x.score+' / '+x.total+'<br>'+x.percent+'%</td><td>'+new Date(x.submittedAt).toLocaleString('kk-KZ')+'</td><td class="answer-details"></td>';tr.children[1].textContent=x.name;tr.children[4].textContent=details;$('rows').appendChild(tr)});$('updated').textContent='Жаңартылды: '+new Date().toLocaleTimeString('kk-KZ')}
$('loginBtn').onclick=async()=>{password=$('password').value;try{await load()}catch(e){$('error').textContent=e.message}};$('refresh').onclick=load;$('download').onclick=()=>{const esc=v=>'"'+String(v??'').replaceAll('"','""')+'"';const lines=[['Студент','Ұпай','Барлығы','Пайыз','Уақыты','Жауаптар'].map(esc).join(',')];data.forEach(x=>lines.push([x.name,x.score,x.total,x.percent,x.submittedAt,(x.answers||[]).map((a,i)=>(i+1)+': '+(a.selectedText||'Жауап жоқ')+' ['+(a.correct?'дұрыс':'қате')+']').join(' | ')].map(esc).join(',')));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='qazaq-quiz-natizhe.csv';a.click();URL.revokeObjectURL(a.href)};$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
</script></body></html>
