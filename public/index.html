</style></head><body><section id="start" class="hero"><div class="card"><div class="tag">ҚАЗАҚ ӘДЕБИЕТІ · МАХАМБЕТ ӨТЕМІСҰЛЫ</div><h1 class="title">Мен, мен едім,<br><span style="color:#a43b2d">мен едім!</span></h1><p class="lead">Махамбеттің күрескер поэзиясы, тарихи тұлғасы мен көркем образдары бойынша 20 күрделі сұрақ. Әр сұраққа 60 секунд.</p><label><b>Аты-жөніңіз</b><input id="studentName" class="input" placeholder="Аты-жөніңізді жазыңыз"></label><button id="startButton" type="button" class="btn">⚔️ Куизді бастау</button></div></section><section id="game" class="game hide"><div class="wrap"><div class="top"><span id="progress"></span><span>⏱ <span id="timer">60</span> сек</span></div><div class="bar"><i id="timebar"></i></div><div id="q" class="question"></div><div id="answers" class="answers"></div><div id="feedback" class="feedback hide"></div></div></section><section id="result" class="hero hide"><div class="card result"><div style="font-size:70px">🏆</div><h2 id="congrats" class="title" style="font-size:46px"></h2><div id="score" class="score"></div><p class="lead">Куиз аяқталды. Жарайсың!</p><button class="btn" onclick="location.reload()">Қайта ойнау</button></div></section><script>
const Q=[["Көтерілістің тууына негіз болған тарихи себептерді неғұрлым толық сипаттайтын тұжырымды анықтаңыз.",["Хандық биліктің әлсіреуі, сыртқы сауданың тоқтауы және руаралық қақтығыстың күшеюі","Жайылымдардың билеуші топтарға бөлінуі, халықтың жерден айырылуы және салықтың ауырлауы","Әскери басқарудың жойылуы, білім беру ісінің тоқтауы және көшіп-қонуға тыйым салынуы","Хандықтың таратылуы, дәстүрлі билер сотының жойылуы және қала халқының көбеюі"],1],["Бөкей Ордасындағы тарихи жағдай мен Махамбет поэзиясының байланысын дәл көрсететін пікірді табыңыз.",["Жер мен салық мәселесі ақын поэзиясында ел тағдыры және әлеуметтік әділет тақырыбына ұласты","Білім мен ғылым мәселесі ақын поэзиясында ағартушылық және мәдени жаңғыру тақырыбына ұласты","Сауда мен қолөнер мәселесі ақын поэзиясында қалалық өмір және кәсіпкерлік тақырыбына ұласты","Дін мен дәстүр мәселесі ақын поэзиясында рухани тәрбие және имандылық тақырыбына ұласты"],0],["1836–1838 жылдардағы көтерілістің екі кезеңге бөлінуінің негізгі өлшемі қандай?",["Көтеріліс басшыларының мақсаттары мен әлеуметтік құрамының түбегейлі өзгеруі","Қозғалыстың өткен аумағы мен шешуші шайқастардың хронологиялық кезектесуі","Патша әкімшілігінің саясаты мен хандық басқару жүйесінің толық ауысуы","Ақын шығармаларының мазмұны мен көркемдік тәсілдерінің біртіндеп өзгеруі"],1],["Көтерілістің бірінші және екінші кезеңдерінің аяқталуын дұрыс сәйкестендіріңіз.",["Бірінші кезең Ақбұлақ шайқасымен, екінші кезең Тастөбе шайқасымен аяқталды","Бірінші кезең Тастөбе шайқасымен, екінші кезең Ақбұлақ шайқасымен аяқталды","Бірінші кезең Орынборға өтініш берумен, екінші кезең хан ордасын қоршаумен аяқталды","Бірінші кезең Жәңгірдің реформасымен, екінші кезең Махамбеттің қазасымен аяқталды"],1],["Исатай бастаған қозғалыстың талаптарын жинақтайтын нұсқаны белгілеңіз.",["Жерді әділ пайдалану, бұрынғы жайылымдарды қайтару және салықты азайту","Хандықты толық жою, жаңа астана құру және тұрақты әскер қалыптастыру","Сауда еркіндігін кеңейту, мектептер ашу және әкімшілік реформаны жалғастыру","Руаралық дауды тоқтату, діни басқаруды күшейту және сот жүйесін жаңарту"],0],["Махамбеттің көтерілістегі тарихи қызметін толық сипаттайтын жауапты табыңыз.",["Көтерілістің жыршысы, саяси идеологы және қолбасшыларының бірі болды","Көтерілістің шежірешісі, ресми елшісі және хан кеңесінің мүшесі болды","Көтерілістің бақылаушысы, келіссөз жүргізушісі және әскери кеңесшісі болды","Көтерілістің тарихшысы, мұрағатшысы және Орынбордағы өкілі болды"],0],["«Ереуіл атқа ер салмай» өлеңіндегі әрекеттер тізбегінің көркемдік қызметін анықтаңыз.",["Батырдың күрес жолындағы ауыр сындарға төзімділігін сатылы түрде күшейтіп көрсетеді","Батырдың бейбіт өмірдегі күнделікті тіршілігін бірізді түрде сипаттап көрсетеді","Батырдың табиғат құбылыстарынан алған әсерін жүйелі түрде жинақтап көрсетеді","Батырдың өткен өміріне деген өкінішін хронологиялық түрде таратып көрсетеді"],0],["«Ереуіл атқа ер салмай» өлеңінің негізгі идеясына сәйкес келетін тұжырымды белгілеңіз.",["Елдік мақсатқа жету үздіксіз күресті, төзімділікті және жеке құрбандықты талап етеді","Әлеуметтік келісімге жету сабырлы мәмілені, кешірімділікті және бейтараптықты талап етеді","Жеке беделге жету білімділікті, шешендікті және билікке жақындықты талап етеді","Рухани кемелдікке жету жалғыздықты, тыныштықты және дүниеден безінуді талап етеді"],0],["«Қас үлектен туған қатепті қара нар» образының мәтіндегі мағынасын анықтаңыз.",["Күрес жүгін көтеретін қайсар әрі төзімді ердің бейнесін танытады","Халықтан оқшауланған тәкаппар әрі қатал билеушінің бейнесін танытады","Ел кезген тәжірибелі әрі сабырлы жолаушының бейнесін танытады","Дәулетінен айырылған мұңды әрі шарасыз адамның бейнесін танытады"],0],["«Қабырғасын қаусатып, бір-біріндеп сөксе де, қабағын шытпас ер керек» жолдарында батырға қойылған басты талап қандай?",["Дене жарақатына және ауыр сынға мойымайтын рух беріктігі","Қарсыластың айласын алдын ала болжайтын терең білімділік","Халықтың алдында сөз бастайтын ерекше шешендік қабілет","Билік өкілдерімен тіл табысатын саяси мәмілегерлік қасиет"],0],["«Боз ағаштан биік мен едім» және «Томағалы сұңқар мен едім» образдарын біріктіретін көркемдік мағына қандай?",["Лирикалық қаһарманның биік рухы, еркіндігі және жауынгерлік қуаты","Лирикалық қаһарманның жалғыздығы, шарасыздығы және өмірден түңілуі","Лирикалық қаһарманның байлығы, әлеуметтік беделі және тектілік мақтанышы","Лирикалық қаһарманның табиғатқа жақындығы, тыныштығы және сезімталдығы"],0],["«Мен бір шарға ұстанған қара балта едім, шабуын таппай кетілдім, қайраса тағы жетілдім» жолдарындағы балта образы нені білдіреді?",["Қолайлы жағдай туса, күреске қайта кірісуге дайын қаһармандық күшті","Ұзақ шайқастардан кейін өз мүмкіндігін толық жоғалтқан әлсіздікті","Билікке қызмет ету арқылы жоғары мәртебеге жетуге деген ұмтылысты","Бұрынғы өмірді ұмытып, бейбіт тіршілікке оралуға деген шешімді"],0],["«Ханнан қырық туғанша, қарадан бір-ақ тусайшы, халықтың кегін қусайшы» жолдарының әлеуметтік мазмұнын анықтаңыз.",["Адамның құндылығы шыққан тегінен емес, халыққа атқарған қызметінен танылады","Адамның беделі шыққан тегіне, билік дәрежесіне және байлығына тәуелді болады","Халықтың болашағы хан ұрпағының саны мен саяси ықпалына байланысты болады","Қоғамдағы тұрақтылық билеуші топ пен қараша халықтың бөлінуіне негізделеді"],0],["Исатай бейнесін жасаудағы «теңіздей терең ақылдым» және «тебіренбес ауыр мінездім» тіркестерінің қызметі қандай?",["Батырдың ақыл-парасаты мен ұстамды мінезін өзара сабақтастырады","Батырдың сыртқы келбеті мен әскери киімін өзара сабақтастырады","Батырдың әлеуметтік жағдайы мен шыққан тегін өзара сабақтастырады","Батырдың қайғылы тағдыры мен жалғыздығын өзара сабақтастырады"],0],["«Қайыспас қара нар» және «алтын ердің қасы» бейнелеріне ортақ идеяны анықтаңыз.",["Исатайдың халық сүйенген берік тұлға әрі ел бастаған ер болғаны","Исатайдың дәулетті ортадан шыққан беделді би әрі шешен болғаны","Исатайдың хан билігімен келісімге келген сабырлы тұлға болғаны","Исатайдың әскери күрестен гөрі с
